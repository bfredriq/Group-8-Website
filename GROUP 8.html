003c/path>\n            \u003c/svg>\n            \u003cspan>Back to Top\u003c/span>\n          \u003c/a>\n          \u003cbutton\n            type="button"\n            id="footer-session-btn"\n            class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl theme-btn-outline text-xs sm:text-sm font-bold cursor-pointer"\n          >\n            \u003cspan>View Visitor Session Stats\u003c/span>\n          \u003c/button>\n        \u003c/div>\n\n        \u003cdiv\n          class="mt-9 pt-6 border-t text-xs sm:text-sm theme-text-muted"\n          style="border-color: var(--border-color)"\n        >\n          &copy; \u003cspan id="current-year">2026\u003c/span> MBABAZI ANAH (\u003cspan\n            class="font-mono font-semibold"\n            >25/U/03878/PS\u003c/span\n          >). All rights reserved.\n        \u003c/div>\n      \u003c/div>\n    \u003c/footer>\n\n    \u003c!-- =========================================================\n         INTERACTIVE SESSION INFORMATION MODAL\n    ========================================================== -->\n    \u003cdiv\n      id="session-modal"\n      class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop"\n      role="dialog"\n      aria-modal="true"\n      aria-labelledby="modal-title"\n    >\n      \u003cdiv\n        class="theme-card w-full max-w-lg rounded-3xl p-6 sm:p-8 relative shadow-2xl transform transition-all"\n      >\n        \u003c!-- Close Button -->\n        \u003cbutton\n          id="close-modal-btn"\n          type="button"\n          aria-label="Close Modal"\n          class="absolute top-5 right-5 p-2 rounded-xl theme-btn-outline cursor-pointer"\n        >\n          \u003csvg\n            class="w-5 h-5"\n            fill="none"\n            stroke="currentColor"\n            stroke-width="2"\n            viewBox="0 0 24 24"\n          >\n            \u003cpath\n              stroke-linecap="round"\n              stroke-linejoin="round"\n              d="M6 18L18 6M6 6l12 12"\n            >\u003c/path>\n          \u003c/svg>\n        \u003c/button>\n\n        \u003c!-- Modal Header -->\n        \u003cdiv class="pr-10">\n          \u003cspan\n            id="modal-badge"\n            class="inline-block px-3 py-1 rounded-lg theme-badge font-mono text-xs font-extrabold uppercase tracking-wider mb-2"\n          >\n            Session Details\n          \u003c/span>\n          \u003ch3\n            id="modal-title"\n            class="font-serif text-2xl font-bold theme-text-primary"\n          >\n            Session Information\n          \u003c/h3>\n        \u003c/div>\n\n        \u003c!-- Modal Dynamic Body -->\n        \u003cdiv\n          id="modal-body"\n          class="mt-5 space-y-4 text-sm theme-text-secondary"\n        >\n          \u003c!-- Populated via JavaScript -->\n        \u003c/div>\n\n        \u003c!-- Modal Footer -->\n        \u003cdiv\n          class="mt-7 pt-4 border-t flex items-center justify-between gap-3"\n          style="border-color: var(--border-color)"\n        >\n          \u003cspan class="text-xs font-mono theme-text-muted"\n            >MBABAZI ANAH &bull; 25/U/03878/PS\u003c/span\n          >\n          \u003cbutton\n            id="modal-done-btn"\n            type="button"\n            class="px-5 py-2 rounded-xl theme-btn-primary text-xs font-bold cursor-pointer"\n          >\n            Close Info\n          \u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- Vanilla JavaScript for Themes, Session Filtering & Session Information Modal -->\n    \u003cscript>\n      document.addEventListener("DOMContentLoaded", () => {\n        // Set current year\n        const yearEl = document.getElementById("current-year");\n        if (yearEl) yearEl.textContent = new Date().getFullYear();\n\n        // ---------------------------------------------------------\n        // 1. MULTI-THEME SWITCHER (Light, Dark & Sage)\n        // ---------------------------------------------------------\n        const htmlEl = document.documentElement;\n        const themeButtons = document.querySelectorAll(".theme-switch-btn");\n        const validThemes = ["light", "dark", "sage"];\n\n        const setTheme = (themeName) => {\n          const resolvedTheme = validThemes.includes(themeName)\n            ? themeName\n            : "light";\n          htmlEl.setAttribute("data-theme", resolvedTheme);\n          localStorage.setItem("anah-blog-theme", resolvedTheme);\n\n          themeButtons.forEach((btn) => {\n            const isMatch =\n              btn.getAttribute("data-set-theme") === resolvedTheme;\n            if (isMatch) {\n              btn.style.backgroundColor = "var(--accent-primary)";\n              btn.style.color = "#FFFFFF";\n            } else {\n              btn.style.backgroundColor = "transparent";\n              btn.style.color = "var(--text-secondary)";\n            }\n          });\n        };\n\n        const savedTheme = localStorage.getItem("anah-blog-theme");\n        setTheme(validThemes.includes(savedTheme) ? savedTheme : "light");\n\n        themeButtons.forEach((btn) => {\n          btn.addEventListener("click", () => {\n            setTheme(btn.getAttribute("data-set-theme"));\n          });\n        });\n\n        // ---------------------------------------------------------\n        // 1B. TOP-RIGHT PROFILE PICTURE UPLOAD, PREVIEW & STORAGE\n        // ---------------------------------------------------------\n        const profileInput = document.getElementById("profile-pic-input");\n        const profilePreview = document.getElementById("profile-pic-preview");\n        const profilePlaceholder = document.getElementById(\n          "profile-pic-placeholder",\n        );\n        const removePicBtn = document.getElementById("remove-profile-pic-btn");\n        const profileCaption = document.getElementById("profile-pic-caption");\n        const PROFILE_STORAGE_KEY = "anah-blog-profile-pic";\n\n        const applyProfileImage = (dataUrl) => {\n          if (dataUrl) {\n            profilePreview.src = dataUrl;\n            profilePreview.classList.remove("hidden");\n            profilePlaceholder.classList.add("hidden");\n            removePicBtn.classList.remove("hidden");\n            removePicBtn.classList.add("flex");\n            profileCaption.textContent = "Click photo to change";\n          } else {\n            profilePreview.src = "";\n            profilePreview.classList.add("hidden");\n            profilePlaceholder.classList.remove("hidden");\n            removePicBtn.classList.add("hidden");\n            removePicBtn.classList.remove("flex");\n            profileCaption.textContent = "Click frame to set photo";\n          }\n        };\n\n        // Load saved profile picture if available\n        try {\n          const savedPic = localStorage.getItem(PROFILE_STORAGE_KEY);\n          if (savedPic) applyProfileImage(savedPic);\n        } catch (e) {\n          // Ignore storage access errors\n        }\n\n        if (profileInput) {\n          profileInput.addEventListener("change", (e) => {\n            const file = e.target.files && e.target.files[0];\n            if (!file || !file.type.startsWith("image/")) return;\n\n            const reader = new FileReader();\n            reader.onload = (event) => {\n              const result = event.target.result;\n              applyProfileImage(result);\n              try {\n                localStorage.setItem(PROFILE_STORAGE_KEY, result);\n              } catch (err) {\n                // If image exceeds localStorage quota, preview still works for current session\n              }\n            };\n            reader.readAsDataURL(file);\n          });\n        }\n\n        if (removePicBtn) {\n          removePicBtn.addEventListener("click", (e) => {\n            e.preventDefault();\n            e.stopPropagation();\n            if (profileInput) profileInput.value = "";\n            applyProfileImage(null);\n            try {\n              localStorage.removeItem(PROFILE_STORAGE_KEY);\n            } catch (err) {\n              // Ignore storage errors\n            }\n          });\n        }\n\n        // ---------------------------------------------------------\n        // 2. THREE SESSIONS FILTER TABS\n        // ---------------------------------------------------------\n        const filterTabs = document.querySelectorAll(".filter-tab");\n        const sessionBlocks = document.querySelectorAll(".session-block");\n\n        filterTabs.forEach((tab) => {\n          tab.addEventListener("click", () => {\n            const target = tab.getAttribute("data-filter");\n\n            filterTabs.forEach((t) => t.classList.remove("active"));\n            tab.classList.add("active");\n\n            sessionBlocks.forEach((block) => {\n              if (\n                target === "all" ||\n                block.getAttribute("data-session-card") === target\n              ) {\n                block.classList.remove("hidden");\n              } else {\n                block.classList.add("hidden");\n              }\n            });\n          });\n        });\n\n        // ---------------------------------------------------------\n        // 3. READING PROGRESS BAR & VISITOR SESSION TIMER\n        // ---------------------------------------------------------\n        const progressBar = document.getElementById("reading-progress");\n        const headerTimer = document.getElementById("header-timer");\n        const sessionStartTime = new Date();\n        let secondsElapsed = 0;\n        const viewedSessions = new Set();\n\n        // Generate a unique visitor session ID\n        const visitorSessionId =\n          "SES-" + Math.random().toString(36).substring(2, 8).toUpperCase();\n\n        const formatDuration = (totalSec) => {\n          const mins = String(Math.floor(totalSec / 60)).padStart(2, "0");\n          const secs = String(totalSec % 60).padStart(2, "0");\n          return `${mins}:${secs}`;\n        };\n\n        setInterval(() => {\n          secondsElapsed++;\n          if (headerTimer) {\n            headerTimer.textContent = formatDuration(secondsElapsed);\n          }\n        }, 1000);\n\n        window.addEventListener(\n          "scroll",\n          () => {\n            const scrollTop =\n              window.scrollY || document.documentElement.scrollTop;\n            const docHeight =\n              document.documentElement.scrollHeight -\n              document.documentElement.clientHeight;\n            const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;\n            if (progressBar) {\n              progressBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;\n            }\n          },\n          { passive: true },\n        );\n\n        // ---------------------------------------------------------\n        // 4. INTERACTIVE SESSION INFORMATION MODAL\n        // ---------------------------------------------------------\n        const modal = document.getElementById("session-modal");\n        const modalBadge = document.getElementById("modal-badge");\n        const modalTitle = document.getElementById("modal-title");\n        const modalBody = document.getElementById("modal-body");\n        const closeModalBtn = document.getElementById("close-modal-btn");\n        const modalDoneBtn = document.getElementById("modal-done-btn");\n\n        const sessionMetadata = {\n          1: {\n            badge: "Session 01 Information",\n            title: "1. About Me & 2. My Interests",\n            readingTime: "~1 Min Read (55 Words)",\n            topics: [\n              "University Student Life",\n              "Learning & Personal Growth",\n              "Technology & Music",\n              "Travelling & Friendship",\n              "Creative Ideas",\n            ],\n            takeaway:\n              "Introducing Mbabazi Anah—a curious university student driven by continuous learning, meaningful connections, and creative exploration.",\n          },\n          2: {\n            badge: "Session 02 Information",\n            title: "3. Technology Corner",\n            readingTime: "~1 Min Read (41 Words)",\n            topics: [\n              "Artificial Intelligence (AI)",\n              "Software Programming",\n              "Digital Innovation",\n              "Everyday Problem Solving",\n            ],\n            takeaway:\n              "Exploring how modern technologies like AI and programming simplify daily life and solve real-world challenges.",\n          },\n          3: {\n            badge: "Session 03 Information",\n            title: "4. My Goals & 5. A Little Inspiration",\n            readingTime: "~1 Min Read (48 Words)",\n            topics: [\n              "Becoming a Skilled IT Professional",\n              "Developing Innovative Solutions",\n              "Confidence & Independence",\n              "Daily Consistency",\n            ],\n            takeaway:\n              "Consistent small daily efforts build lasting success—keep learning, growing, and believing in yourself.",\n          },\n        };\n\n        const openModal = (badgeText, titleText, htmlContent) => {\n          modalBadge.textContent = badgeText;\n          modalTitle.textContent = titleText;\n          modalBody.innerHTML = htmlContent;\n          modal.classList.remove("hidden");\n          modal.classList.add("flex");\n        };\n\n        const closeModal = () => {\n          modal.classList.add("hidden");\n          modal.classList.remove("flex");\n        };\n\n        // Attach listeners to each Session\'s "View Session Info" button\n        document.querySelectorAll("[data-open-session]").forEach((btn) => {\n          btn.addEventListener("click", () => {\n            const sessionNum = btn.getAttribute("data-open-session");\n            viewedSessions.add(`Session ${sessionNum}`);\n            const info = sessionMetadata[sessionNum];\n\n            const topicsHtml = info.topics\n              .map(\n                (topic) =>\n                  `\u003cspan class="px-2.5 py-1 rounded-lg theme-badge text-xs font-semibold">${topic}\u003c/span>`,\n              )\n              .join("");\n\n            const content = `\n                        \u003cdiv class="grid grid-cols-1 sm:grid-cols-2 gap-3">\n                            \u003cdiv class="p-3.5 rounded-2xl theme-secondary-box">\n                                \u003cspan class="block text-xs uppercase tracking-wider theme-text-muted font-bold">Author &amp; Reg No\u003c/span>\n                                \u003cspan class="block font-bold theme-text-primary mt-1">MBABAZI ANAH (25/U/03878/PS)\u003c/span>\n                            \u003c/div>\n                            \u003cdiv class="p-3.5 rounded-2xl theme-secondary-box">\n                                \u003cspan class="block text-xs uppercase tracking-wider theme-text-muted font-bold">Estimated Reading Time\u003c/span>\n                                \u003cspan class="block font-bold theme-text-primary mt-1">${info.readingTime}\u003c/span>\n                            \u003c/div>\n                        \u003c/div>\n                        \u003cdiv class="p-4 rounded-2xl theme-secondary-box">\n                            \u003cspan class="block text-xs uppercase tracking-wider theme-text-muted font-bold mb-2">Key Topics Covered\u003c/span>\n                            \u003cdiv class="flex flex-wrap gap-1.5">${topicsHtml}\u003c/div>\n                        \u003c/div>\n                        \u003cdiv class="p-4 rounded-2xl theme-secondary-box">\n                            \u003cspan class="block text-xs uppercase tracking-wider theme-text-muted font-bold mb-1">Session Summary\u003c/span>\n                            \u003cp class="theme-text-secondary leading-relaxed">${info.takeaway}\u003c/p>\n                        \u003c/div>\n                    `;\n            openModal(info.badge, info.title, content);\n          });\n        });\n\n        // Live Visitor Session Info Modal (Header & Footer buttons)\n        const openVisitorSessionModal = () => {\n          const currentTheme = htmlEl.getAttribute("data-theme").toUpperCase();\n          const screenWidth = window.innerWidth;\n          const deviceType =\n            screenWidth \u003c 640\n              ? "Mobile Viewport"\n              : screenWidth \u003c 1024\n                ? "Tablet Viewport"\n                : "Desktop Viewport";\n          const inspectedList =\n            viewedSessions.size > 0\n              ? Array.from(viewedSessions).join(", ")\n              : "None inspected yet";\n\n          const content = `\n                    \u003cdiv class="grid grid-cols-2 gap-3">\n                        \u003cdiv class="p-3.5 rounded-2xl theme-secondary-box">\n                            \u003cspan class="block text-xs uppercase tracking-wider theme-text-muted font-bold">Visitor Session ID\u003c/span>\n                            \u003cspan class="block font-mono font-bold theme-text-primary mt-1">${visitorSessionId}\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class="p-3.5 rounded-2xl theme-secondary-box">\n                            \u003cspan class="block text-xs uppercase tracking-wider theme-text-muted font-bold">Time on Page\u003c/span>\n                            \u003cspan class="block font-mono font-bold theme-text-primary mt-1">${formatDuration(secondsElapsed)}\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class="p-3.5 rounded-2xl theme-secondary-box">\n                            \u003cspan class="block text-xs uppercase tracking-wider theme-text-muted font-bold">Active Theme\u003c/span>\n                            \u003cspan class="block font-bold theme-text-primary mt-1">${currentTheme} MODE\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class="p-3.5 rounded-2xl theme-secondary-box">\n                            \u003cspan class="block text-xs uppercase tracking-wider theme-text-muted font-bold">Responsive Layout\u003c/span>\n                            \u003cspan class="block font-bold theme-text-primary mt-1">${deviceType} (${screenWidth}px)\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cdiv class="p-4 rounded-2xl theme-secondary-box">\n                        \u003cspan class="block text-xs uppercase tracking-wider theme-text-muted font-bold mb-1">Blog Structure Overview\u003c/span>\n                        \u003cp class="theme-text-secondary">3 Sessions Available &bull; Started at ${sessionStartTime.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}\u003c/p>\n                        \u003cp class="text-xs theme-text-muted mt-1">Inspected Sessions: \u003cstrong class="theme-text-primary">${inspectedList}\u003c/strong>\u003c/p>\n                    \u003c/div>\n                `;\n          openModal(\n            "Active Visitor Session",\n            "Live Session Information",\n            content,\n          );\n        };\n\n        document\n          .getElementById("visitor-session-btn")\n          .addEventListener("click", openVisitorSessionModal);\n        document\n          .getElementById("footer-session-btn")\n          .addEventListener("click", openVisitorSessionModal);\n\n        closeModalBtn.addEventListener("click", closeModal);\n        modalDoneBtn.addEventListener("click", closeModal);\n        modal.addEventListener("click", (e) => {\n          if (e.target === modal) closeModal();\n        });\n        document.addEventListener("keydown", (e) => {\n          if (e.key === "Escape" && !modal.classList.contains("hidden"))\n            closeModal();\n        });\n      });\n    \u003c/script>\n  \u003c/body>\n\u003c/html>\n',
        },
        {
          label: "3. Irene",
          html: '\u003c!DOCTYPE html>\n\u003chtml lang="en">\n\u003chead>\n  \u003cmeta charset="UTF-8">\n  \u003cmeta name="viewport" content="width=device-width, initial-scale=1.0">\n  \u003ctitle>Namayanja Irene | Personal Blog\u003c/title>\n  \u003cstyle>\n/* ---------- Theme variables ---------- */\n:root {\n  --bg: #ffc0cb;\n  --card: #fff0f5;\n  --text: #4a1230;\n  --accent: #d6336c;\n  --accent-text: #ffffff;\n}\nbody[data-theme="dark"] {\n  --bg: #2b1a24;\n  --card: #3d2633;\n  --text: #ffe3ee;\n  --accent: #ff7aa8;\n  --accent-text: #2b1a24;\n}\nbody[data-theme="light"] {\n  --bg: #ffffff;\n  --card: #f4f4f4;\n  --text: #222222;\n  --accent: #d6336c;\n  --accent-text: #ffffff;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  font-family: "Segoe UI", Tahoma, Arial, sans-serif;\n  background: var(--bg);\n  color: var(--text);\n  line-height: 1.6;\n  transition: background 0.3s, color 0.3s;\n}\n\n/* ---------- Header ---------- */\nheader {\n  text-align: center;\n  padding: 2rem 1rem 1rem;\n}\nheader h1 { font-size: 2rem; }\nheader p { margin-top: 0.3rem; font-style: italic; }\n\n.reg-no {\n  font-style: normal;\n  font-weight: 600;\n  color: var(--accent);\n  letter-spacing: 1px;\n}\n\n/* ---------- Profile picture (small) ---------- */\n.profile-pic {\n  width: 90px;\n  height: 90px;\n  object-fit: cover;\n  object-position: center 15%;\n  border-radius: 50%;\n  border: 3px solid var(--accent);\n  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);\n  margin-bottom: 0.6rem;\n}\n@media (min-width: 700px) {\n  .profile-pic {\n    width: 110px;\n    height: 110px;\n  }\n}\n\n/* ---------- Theme switcher ---------- */\n.theme-switcher {\n  margin-top: 1rem;\n  display: flex;\n  justify-content: center;\n  flex-wrap: wrap;\n  gap: 0.5rem;\n}\n.theme-switcher span { align-self: center; font-weight: 600; }\n\nbutton {\n  background: var(--accent);\n  color: var(--accent-text);\n  border: none;\n  padding: 0.5rem 1rem;\n  border-radius: 20px;\n  cursor: pointer;\n  font-size: 0.95rem;\n}\nbutton:hover { opacity: 0.85; }\n\n/* ---------- Sessions layout ---------- */\nmain {\n  max-width: 1100px;\n  margin: 1.5rem auto;\n  padding: 0 1rem;\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 1.2rem;\n}\n@media (min-width: 700px)  { main { grid-template-columns: repeat(2, 1fr); } }\n@media (min-width: 1000px) { main { grid-template-columns: repeat(3, 1fr); } }\n\n.session {\n  background: var(--card);\n  border-radius: 14px;\n  padding: 1.3rem;\n  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);\n}\n.session h2 { margin-bottom: 0.6rem; color: var(--accent); }\n.session ul { margin-left: 1.2rem; }\n\n.info {\n  display: none;\n  margin-top: 0.8rem;\n  padding: 0.7rem;\n  border-left: 4px solid var(--accent);\n  font-size: 0.9rem;\n}\n.info.show { display: block; }\n.session button { margin-top: 1rem; }\n\nfooter { text-align: center; padding: 1.5rem 1rem; font-size: 0.85rem; }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-theme="pink">\n\n  \u003cheader>\n    \u003cimg src="irene.jpg" alt="Namayanja Irene" class="profile-pic">\n    \u003ch1>Namayanja Irene\u003c/h1>\n    \u003cp class="reg-no">Reg No: 25/U/03995/EVE\u003c/p>\n    \u003cp>Welcome to my personal blog\u003c/p>\n\n    \u003cdiv class="theme-switcher">\n      \u003cspan>Theme:\u003c/span>\n      \u003cbutton onclick="setTheme(\'pink\')">Pink\u003c/button>\n      \u003cbutton onclick="setTheme(\'dark\')">Dark\u003c/button>\n      \u003cbutton onclick="setTheme(\'light\')">Light\u003c/button>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cmain>\n    \u003c!-- Session One -->\n    \u003csection class="session">\n      \u003ch2>Session 1: About Me\u003c/h2>\n      \u003cp>Hello! I\'m Namayanja Irene. Here are a few things I love:\u003c/p>\n      \u003cul>\n        \u003cli>Swimming\u003c/li>\n        \u003cli>Dancing\u003c/li>\n        \u003cli>Watching K-dramas\u003c/li>\n        \u003cli>Going on tours\u003c/li>\n      \u003c/ul>\n      \u003cbutton onclick="toggleInfo(\'info1\', this)">View session info\u003c/button>\n      \u003cdiv id="info1" class="info">\n        \u003cstrong>Session 1 info:\u003c/strong> An introduction to who I am and\n        the hobbies that make me happy.\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- Session Two -->\n    \u003csection class="session">\n      \u003ch2>Session 2: Why Swimming Matters\u003c/h2>\n      \u003cp>\n        Swimming has been very important in my life. It keeps my body healthy\n        and strong, and it helps me relax when I feel stressed. In the water I\n        feel free and calm, and it has given me confidence, discipline and\n        energy for my daily activities. It has also helped me meet new people\n        and enjoy time with friends.\n      \u003c/p>\n      \u003cbutton onclick="toggleInfo(\'info2\', this)">View session info\u003c/button>\n      \u003cdiv id="info2" class="info">\n        \u003cstrong>Session 2 info:\u003c/strong> How swimming has shaped my health,\n        mood and confidence.\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- Session Three -->\n    \u003csection class="session">\n      \u003ch2>Session 3: What I\'ve Learned\u003c/h2>\n      \u003cp>\n        Through swimming I have learned patience, because improvement takes\n        time and practice. I have learned to keep going even when it feels\n        hard, to set goals and work towards them, and to stay disciplined.\n        I have also learned that taking care of my body and mind is just as\n        important as my studies.\n      \u003c/p>\n      \u003cbutton onclick="toggleInfo(\'info3\', this)">View session info\u003c/button>\n      \u003cdiv id="info3" class="info">\n        \u003cstrong>Session 3 info:\u003c/strong> The lessons and values I have gained\n        from swimming.\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cfooter>\n    &copy; 2026 Namayanja Irene | Reg No: 25/U/03995/EVE\n  \u003c/footer>\n\n  \u003cscript>\n// Switch between themes\nfunction setTheme(name) {\n  document.body.setAttribute(\'data-theme\', name);\n}\n\n// Show / hide session information\nfunction toggleInfo(id, btn) {\n  const box = document.getElementById(id);\n  box.classList.toggle(\'show\');\n  btn.textContent = box.classList.contains(\'show\')\n    ? \'Hide session info\'\n    : \'View session info\';\n}\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n',

          html: '\u003c!DOCTYPE html>\n\u003chtml lang="en">\n\u003chead>\n\u003cmeta charset="UTF-8">\n\u003cmeta name="viewport" content="width=device-width, initial-scale=1">\n\u003ctitle>Queen\'s Learning Blog\u003c/title>\n\u003cstyle>\n  /* ---------- 1. THEMES ----------\n     Each theme is just a set of colour variables.\n     JavaScript switches the data-theme attribute on \u003chtml>. */\n  :root, [data-theme="lake"] {\n    --bg: #eef3f6; --surface: #ffffff; --ink: #12303b; --muted: #4d6670;\n    --accent: #1f7a8c; --on-accent: #ffffff; --line: #c9d8de;\n  }\n  [data-theme="night"] {\n    --bg: #0f1b22; --surface: #182a33; --ink: #e6eef2; --muted: #9fb4be;\n    --accent: #7fd1c7; --on-accent: #0f1b22; --line: #2c424d;\n  }\n  [data-theme="plum"] {\n    --bg: #2a1b3d; --surface: #3a2753; --ink: #f3e9ff; --muted: #c4b0de;\n    --accent: #ffb86b; --on-accent: #2a1b3d; --line: #55407a;\n  }\n\n  /* ---------- 2. BASE ---------- */\n  * { box-sizing: border-box; }\n  body {\n    margin: 0; background: var(--bg); color: var(--ink);\n    font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;\n    transition: background .25s, color .25s;\n  }\n  h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; line-height: 1.2; margin: 0 0 .5rem; }\n  .wrap { width: min(1100px, 100% - 2rem); margin-inline: auto; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }\n\n  /* ---------- 3. HEADER + THEME SWITCHER ---------- */\n  header { border-bottom: 1px solid var(--line); padding: 1rem 0; }\n  .bar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; }\n  .brand { font: 700 1.25rem Georgia, serif; }\n  .themes { display: flex; gap: .5rem; align-items: center; }\n  .themes span { color: var(--muted); font-size: .9rem; }\n  .theme-btn {\n    padding: .4rem .9rem; border-radius: 999px; cursor: pointer;\n    border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: .9rem;\n  }\n  .theme-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }\n\n  /* ---------- 4. INTRO ---------- */\n  .intro { padding: clamp(2rem, 6vw, 4.5rem) 0 2rem; display: grid; gap: 2rem; align-items: center; grid-template-columns: 1fr; }\n  .intro-photo { margin: 0; justify-self: center; width: min(320px, 100%); }\n  .intro-photo img {\n    display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: center 20%;\n    border-radius: 14px; border: 4px solid var(--surface); box-shadow: 0 8px 24px rgba(0,0,0,.2);\n  }\n  @media (min-width: 768px) {\n    .intro { grid-template-columns: 1fr auto; gap: 3rem; }\n    .intro-photo { justify-self: end; }\n  }\n  .intro h1 { font-size: clamp(2rem, 6vw, 3.6rem); max-width: 18ch; }\n  .intro p { max-width: 60ch; color: var(--muted); font-size: 1.1rem; }\n\n  /* ---------- 5. SESSIONS GRID (responsive) ----------\n     auto-fit makes the grid use 1, 2 or 3 columns depending on width. */\n  .sessions { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); padding-bottom: 3rem; }\n  .card {\n    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;\n    padding: 1.5rem; display: flex; flex-direction: column; gap: .75rem;\n  }\n  .card .when { color: var(--muted); font-size: .9rem; }\n  .card p { margin: 0; flex: 1; }\n  .btn {\n    align-self: flex-start; padding: .55rem 1.1rem; border-radius: 6px; cursor: pointer;\n    border: 0; background: var(--accent); color: var(--on-accent); font: 600 .95rem system-ui, sans-serif;\n  }\n\n  /* ---------- 6. SESSION INFO DIALOG ---------- */\n  dialog {\n    width: min(520px, 100% - 2rem); border: 1px solid var(--line); border-radius: 10px;\n    background: var(--surface); color: var(--ink); padding: 1.75rem;\n  }\n  dialog::backdrop { background: rgba(0, 0, 0, .55); }\n  dialog dl { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1rem; margin: 1rem 0; }\n  dialog dt { color: var(--muted); }\n  dialog dd { margin: 0; }\n\n  footer { border-top: 1px solid var(--line); padding: 1.5rem 0; color: var(--muted); font-size: .9rem; }\n\n  /* ---------- 7. SMALL SCREENS ---------- */\n  @media (max-width: 480px) {\n    .bar { flex-direction: column; align-items: flex-start; }\n    .themes span { display: none; }\n  }\n  @media (prefers-reduced-motion: reduce) { body { transition: none; } }\n\n/* ---------- 8. TABLE AND LISTS ---------- */\n.info-block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.25rem; }\n.table-scroll { overflow-x: auto; }\ntable { width: 100%; border-collapse: collapse; min-width: 480px; }\ncaption { text-align: left; color: var(--muted); font-size: .9rem; padding-bottom: .5rem; }\nth, td { text-align: left; padding: .65rem .8rem; border-bottom: 1px solid var(--line); }\nthead th { background: var(--accent); color: var(--on-accent); }\ntbody tr:nth-child(even) { background: var(--bg); }\ntfoot td { font-weight: 700; border-bottom: 0; }\n.lists { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); padding-bottom: 3rem; }\n.lists .info-block { margin-bottom: 0; }\n.info-block ul, .info-block ol { margin: 0; padding-left: 1.4rem; }\n.info-block li { margin-bottom: .4rem; }\n.info-block li::marker { color: var(--accent); font-weight: 700; }\ncode { background: var(--bg); padding: .1rem .35rem; border-radius: 4px; font-size: .9em; }\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader>\n  \u003cdiv class="wrap bar">\n    \u003cdiv class="brand">Queen\'s Learning Blog\u003c/div>\n    \u003cdiv class="themes" role="group" aria-label="Choose a theme">\n      \u003cspan>Theme:\u003c/span>\n      \u003cbutton class="theme-btn" data-theme-choice="lake">Lake\u003c/button>\n      \u003cbutton class="theme-btn" data-theme-choice="night">Night\u003c/button>\n      \u003cbutton class="theme-btn" data-theme-choice="plum">Plum\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain class="wrap">\n  \u003csection class="intro">\n    \u003cdiv class="intro-text">\n      \u003ch1>Three sessions, three things I learned\u003c/h1>\n      \u003cp>I\'m a first-year Information Systems and Technology student. This blog records what each web development session taught me. Select a session to see its details.\u003c/p>\n    \u003c/div>\n    \u003cfigure class="intro-photo">\n      \u003cimg src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAPoAu4DASIAAhEBAxEB/8QAHQAAAgMBAQEBAQAAAAAAAAAABQYDBAcCAQAICf/EAEkQAAIBAwMCBQEGBAMGBAUCBwECAwAEEQUSITFBBhMiUWFxBxQygZGhI0KxwRVS0SQzYnLh8AiCkvEWQ1OisiU0Y8IX0kRz4v/EABsBAAIDAQEBAAAAAAAAAAAAAAIDAQQFAAYH/8QALhEAAgICAwACAwACAgICAgMAAAECEQMhBBIxBUETIlEyYRQjQnEGFSRSM4Gh/9oADAMBAAIRAxEAPwAu0GT0qxGu1AMV3iva99GCR5BybPMV5XWK+owTmvJJBGpJruqV6zYIAoZOlZKVsqXN2zNgHFWdMnfoxxQlgw9TdK7gmZWGBwaxeZB54NGlxZrFNDRq+nC70/cecjrX5x8d+HL/APxmRLOFniY5J9jX6NgvWNqsZPpIqn/g9tcz+Y5X614q58WbjJHpdZY2mfmvS/C+owsTcwkJ7jmnHQtMFtIrEc561sdzoluiHaAynpSffWCwXLxYC9xWvw5fnh2XqM7krpIiEzKgCjPvVmFRPCQcjNVY4WTjIq5bS+ll4zWlCdL9ijKNvRLYWbtOFhHA6mn/AEWxIiG4frQbw1AoX1/iNaFpUULxquBge9eX+Qy9sjSNziw6wVi7qWlh0KqoOR1pB1Lw7G195pHI6VrGuPHCG2nFKFyfMf1DinfFQU8ycvCObPridFPTbUW0AHeitvfIAFYVWA4HtXgiUuCvFeu+Rx483FcUYPAlPHmtjBbSoFVkxg0x2cYkhyefekyI7V25zim/QHD2vJznivm04dW0z1ydohMCGXGOM1cthDGecA1T1W5jtN24gd6S7zX3lnIibgHrmmQg2Q5JGnHV7e3TBcce9JvifUjdoxjPHalaa6upTuctjrUkF+hIR8c+9NjjrYLFPUpXErb89aqWd2rTYlPFNGs2UU6MysKzzVZPuVx14zVqO0Lbod38pYdykZ7UPtbwi4w54zQS11fzVWPdkdKORQp9339T1NQ1RFli5uwHDLwRzmlnxhrzyW7IjZ4xVvULgD0R5LYxily40ya6djIMLmrXF48skuyK/IzKCoXdKieW6zKcbjkZFaFouki4TaVyDQe20rymjJHOeuKftEeO1gAOMgda2JZfwKpGT1/JtA8eGxAwcIOelEYdPijTOQD7V3dX5lycnHQC \u003ctfoot>\n          \u003ctr>\n            \u003ctd colspan="3">Total learning time\u003c/td>\n            \u003ctd>6 hours\u003c/td>\n          \u003c/tr>\n        \u003c/tfoot>\n      \u003c/table>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ---------- UNORDERED + ORDERED LISTS ---------- -->\n  \u003cdiv class="lists">\n    \u003csection class="info-block" aria-labelledby="skills-title">\n      \u003ch2 id="skills-title">Skills I gained\u003c/h2>\n      \u003cul>\n        \u003cli>Writing semantic HTML\n          \u003cul>\n            \u003cli>header, main, section, footer\u003c/li>\n            \u003cli>tables and lists\u003c/li>\n          \u003c/ul>\n        \u003c/li>\n        \u003cli>Making layouts responsive with CSS Grid\u003c/li>\n        \u003cli>Switching themes with CSS variables\u003c/li>\n        \u003cli>Handling clicks with JavaScript\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection class="info-block" aria-labelledby="steps-title">\n      \u003ch2 id="steps-title">How I built this page\u003c/h2>\n      \u003col>\n        \u003cli>Planned the three sessions and what to show for each.\u003c/li>\n        \u003cli>Wrote the page structure in \u003ccode>index.html\u003c/code>.\u003c/li>\n        \u003cli>Styled it and added the three themes in \u003ccode>style.css\u003c/code>.\u003c/li>\n        \u003cli>Added the theme buttons and session pop-ups in \u003ccode>script.js\u003c/code>.\u003c/li>\n        \u003cli>Tested it on a phone-sized and a laptop-sized screen.\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n  \u003c/div>\n\u003c/main>\n\n\u003cfooter>\n  \u003cdiv class="wrap">Built with HTML, CSS and JavaScript.\u003c/div>\n\u003c/footer>\n\n\u003c!-- Session information pops up here -->\n\u003cdialog id="info" aria-labelledby="info-title">\n  \u003ch2 id="info-title">\u003c/h2>\n  \u003cdl id="info-list">\u003c/dl>\n  \u003cp id="info-summary">\u003c/p>\n  \u003cbutton class="btn" id="close-info">Close\u003c/button>\n\u003c/dialog>\n\n\u003cscript>\n  /* ---------- A. SESSION DATA ----------\n     Edit this list to change the blog. Each object is one session. */\n  const SESSIONS = [\n    {\n      title: "Session 1: Structuring a page with HTML",\n      date: "Tuesday, 20 October 2026",\n      teaser: "How headings, sections and links give a page its skeleton.",\n      topic: "HTML structure and semantic tags",\n      duration: "2 hours",\n      summary: "I learned to organise content with header, main, section and footer. Using the right tag makes a page easier to read, easier to style and better for screen readers."\n    },\n    {\n      title: "Session 2: Styling and responsive layout with CSS",\n      date: "Thursday, 22 October 2026",\n      teaser: "Making one layout work on a phone, a tablet and a laptop.",\n      topic: "CSS Grid, media queries and variables",\n      duration: "2 hours",\n      summary: "I learned to use CSS Grid so cards rearrange themselves as the screen changes size. CSS variables let me change all the colours of a page from one place."\n    },\n    {\n      title: "Session 3: Adding behaviour with JavaScript",\n      date: "Tuesday, 27 October 2026",\n      teaser: "Buttons that switch themes and open extra information.",\n      topic: "DOM manipulation and events",\n      duration: "2 hours",\n      summary: "I learned to listen for clicks, change page attributes and build elements from data. This page uses these ideas for the theme switcher and the session pop-ups."\n    }\n  ];\n\n  /* ---------- B. BUILD THE SESSION CARDS ---------- */\n  const grid = document.getElementById("sessions");\n\n  SESSIONS.forEach((s, index) => {\n    const card = document.createElement("article");\n    card.className = "card";\n    card.innerHTML = `\n      \u003cdiv class="when">${s.date}\u003c/div>\n      \u003ch2>${s.title}\u003c/h2>\n      \u003cp>${s.teaser}\u003c/p>\n      \u003cbutton class="btn" data-index="${index}">View session info\u003c/button>`;\n    grid.appendChild(card);\n  });\n\n  /* ---------- C. SESSION INFO DIALOG ---------- */\n  const dialog = document.getElementById("info");\n\n  grid.addEventListener("click", (e) => {\n    const btn = e.target.closest("button[data-index]");\n    if (!btn) return;\n    const s = SESSIONS[btn.dataset.index];\n    document.getElementById("info-title").textContent = s.title;\n    document.getElementById("info-summary").textContent = s.summary;\n    document.getElementById("info-list").innerHTML =\n      `\u003cdt>Date\u003c/dt>\u003cdd>${s.date}\u003c/dd>\n       \u003cdt>Topic\u003c/dt>\u003cdd>${s.topic}\u003c/dd>\n       \u003cdt>Length\u003c/dt>\u003cdd>${s.duration}\u003c/dd>`;\n    dialog.showModal();\n  });\n\n  document.getElementById("close-info").addEventListener("click", () => dialog.close());\n  // Clicking the dark area outside the box also closes it\n  dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });\n\n  /* ---------- D. THEME SWITCHER ----------\n     Saves the choice so it is still there when the page reloads. */\n  const themeButtons = document.querySelectorAll("[data-theme-choice]");\n\n  function setTheme(name) {\n    document.documentElement.setAttribute("data-theme", name);\n    themeButtons.forEach(b => b.setAttribute("aria-pressed", b.dataset.themeChoice === name));\n    try { localStorage.setItem("blog-theme", name); } catch (err) { /* storage unavailable: ignore */ }\n  }\n\n  themeButtons.forEach(b => b.addEventListener("click", () => setTheme(b.dataset.themeChoice)));\n\n  let saved = "lake";\n  try { saved = localStorage.getItem("blog-theme") || "lake"; } catch (err) {}\n  setTheme(saved);\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n',

          label: "6. Peace",
          html: '\u003c!DOCTYPE html>\n\u003chtml lang="en">\n\u003chead>\n  \u003cmeta charset="utf-8">\n  \u003cmeta name="viewport" content="width=device-width, initial-scale=1">\n  \u003ctitle>My Personal Blog\u003c/title>\n\n  \u003cstyle>\n    /* light mode */\n    body {\n      background-color: #f7f5ef;\n      color: #222222;\n      font-family: Georgia, serif;\n      line-height: 1.6;\n      margin: 0;\n      padding: 20px;\n    }\n\n    h1 {\n      color: #3f6b2f;\n    }\n\n    .card {\n      background-color: #ffffff;\n      padding: 16px;\n      border-radius: 4px;\n    }\n\n    /* my details box */\n    .details {\n      background-color: #ffffff;\n      padding: 16px;\n      border-radius: 4px;\n      margin: 20px 0;\n    }\n\n    .details h2 {\n      margin-top: 0;\n    }\n\n    .details p {\n      margin: 4px 0;\n    }\n\n    button {\n      font-size: 16px;\n      padding: 8px 14px;\n      margin: 4px;\n      cursor: pointer;\n    }\n\n    /* cards stack on phones */\n    .sessions {\n      display: grid;\n      grid-template-columns: 1fr;\n      gap: 16px;\n    }\n\n    /* info is hidden till you click */\n    .info {\n      display: none;\n    }\n\n    .info.show {\n      display: block;\n    }\n\n    /* footer at the bottom */\n    footer {\n      text-align: center;\n      margin-top: 30px;\n      padding: 16px;\n      font-size: 14px;\n    }\n\n    /* dark mode */\n    body.dark {\n      background-color: #14181c;\n      color: #e8ecef;\n    }\n\n    body.dark h1 {\n      color: #8fc3ff;\n    }\n\n    body.dark .card,\n    body.dark .details {\n      background-color: #1d242a;\n    }\n\n    /* 3 in a row on big screens */\n    @media (min-width: 700px) {\n      .sessions {\n        grid-template-columns: 1fr 1fr 1fr;\n      }\n    }\n  \u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n  \u003ch1>My Personal Blog\u003c/h1>\n  \u003cp>Welcome to my blog! Pick a theme, then open a session to see more.\u003c/p>\n\n  \u003c!-- theme buttons -->\n  \u003cbutton onclick="changeTheme(\'light\')">Light\u003c/button>\n  \u003cbutton onclick="changeTheme(\'dark\')">Dark\u003c/button>\n\n  \u003c!-- my personal details -->\n  \u003cdiv class="details">\n    \u003ch2>Personal Details\u003c/h2>\n    \u003cp>\u003cb>Name:\u003c/b> Longok Peace Scovia\u003c/p>\n    \u003cp>\u003cb>Registration No:\u003c/b> 25/U/30744\u003c/p>\n    \u003cp>\u003cb>Year:\u003c/b> Year 2, Semester 1\u003c/p>\n    \u003cp>\u003cb>Program:\u003c/b> Bachelor of Information Systems and Technology\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class="sessions">\n\n    \u003c!-- session 1 -->\n    \u003cdiv class="card">\n      \u003ch2>Session 1: Introduction to HTML and Web Page Structure\u003c/h2>\n      \u003cp>I learned how to build the structure of a page.\u003c/p>\n      \u003cbutton onclick="showInfo(\'info1\')">View session info\u003c/button>\n      \u003cdiv class="info" id="info1">\n        \u003cp>\u003cb>Date:\u003c/b> Week 1\u003c/p>\n        \u003cp>\u003cb>Topics:\u003c/b> headings, lists, links\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- session 2 -->\n    \u003cdiv class="card">\n      \u003ch2>Session 2: Styling and Responsive Design with CSS\u003c/h2>\n      \u003cp>I learned how to style the page and make it fit any screen.\u003c/p>\n      \u003cbutton onclick="showInfo(\'info2\')">View session info\u003c/button>\n      \u003cdiv class="info" id="info2">\n        \u003cp>\u003cb>Date:\u003c/b> Week 2\u003c/p>\n        \u003cp>\u003cb>Topics:\u003c/b> colors, grid, media queries\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- session 3 -->\n    \u003cdiv class="card">\n      \u003ch2>Session 3: Adding Interactivity with JavaScript\u003c/h2>\n      \u003cp>I learned how to make the page react when you click.\u003c/p>\n      \u003cbutton onclick="showInfo(\'info3\')">View session info\u003c/button>\n      \u003cdiv class="info" id="info3">\n        \u003cp>\u003cb>Date:\u003c/b> Week 3\u003c/p>\n        \u003cp>\u003cb>Topics:\u003c/b> functions, events, classes\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n  \u003c/div>\n\n  \u003c!-- footer -->\n  \u003cfooter>\n    \u003cp>Copyright &copy; 2026 Longok Peace Scovia. Learning web design\u003c/p>\n  \u003c/footer>\n\n  \u003cscript>\n    // swaps light/dark\n    function changeTheme(theme) {\n      if (theme === \'dark\') {\n        document.body.classList.add(\'dark\');\n      } else {\n        document.body.classList.remove(\'dark\');\n      }\n    }\n\n    // show/hide session info\n    function showInfo(id) {\n      var infoBox = document.getElementById(id);\n      infoBox.classList.toggle(\'show\');\n    }\n  \u003c/script>\n\n\u003c/body>\n\u003c/html>',

ight;\r\n      }\r\n\r\n      :root[data-theme="light"] {\r\n        --bg-overlay: rgba(246, 244, 238, 0.86);\r\n        --surface: rgba(255, 255, 255, 0.85);\r\n        --surface-hover: rgba(255, 255, 255, 0.96);\r\n        --text: #1b221b;\r\n        --muted: #525e52;\r\n        --accent: #3d521e;\r\n        --accent-glow: rgba(61, 82, 30, 0.18);\r\n        --accent-text: #ffffff;\r\n        --line: rgba(27, 34, 27, 0.15);\r\n        --tag-bg: rgba(61, 82, 30, 0.12);\r\n        --table-stripe: rgba(0, 0, 0, 0.03);\r\n        --shadow: 0 12px 32px rgba(0, 0, 0, 0.08);\r\n        color-scheme: light;\r\n      }\r\n\r\n      *,\r\n      *::before,\r\n      *::after {\r\n        box-sizing: border-box;\r\n      }\r\n\r\n      body {\r\n        margin: 0;\r\n        font-family:\r\n          "Work Sans",\r\n          system-ui,\r\n          -apple-system,\r\n          sans-serif;\r\n        color: var(--text);\r\n        line-height: 1.65;\r\n        min-height: 100vh;\r\n        overflow-x: hidden;\r\n        transition: color 0.35s ease;\r\n      }\r\n\r\n      .wallpaper-container {\r\n        position: fixed;\r\n        inset: 0;\r\n        z-index: -2;\r\n        overflow: hidden;\r\n        background: #060b10;\r\n      }\r\n\r\n      #live-wallpaper {\r\n        width: 100%;\r\n        height: 100%;\r\n        object-fit: cover;\r\n        pointer-events: none;\r\n      }\r\n\r\n      #fallback-canvas {\r\n        position: absolute;\r\n        inset: 0;\r\n        width: 100%;\r\n        height: 100%;\r\n        display: none;\r\n      }\r\n\r\n      .wallpaper-tint {\r\n  position: fixed;\r\n  inset: 0;\r\n  z-index: -1;\r\n  background: var(--bg-overlay);\r\n  backdrop-filter: blur(-2px); \r\n  -webkit-backdrop-filter: blur(-2px);\r\n  transition: background 0.4s ease;\r\n}\r\n\r\n      .container {\r\n        max-width: 82rem;\r\n        margin: 0 auto;\r\n        padding: 1.25rem clamp(1rem, 3.5vw, 2.5rem) 4rem;\r\n      }\r\n\r\n      header.topbar {\r\n        display: flex;\r\n        flex-wrap: wrap;\r\n        align-items: center;\r\n        justify-content: space-between;\r\n        gap: 1rem;\r\n        padding: 1rem 1.5rem;\r\n        margin-bottom: 2rem;\r\n        background: var(--surface);\r\n        border: 1px solid var(--line);\r\n        border-radius: 16px;\r\n        backdrop-filter: blur(14px);\r\n        -webkit-backdrop-filter: blur(14px);\r\n        box-shadow: var(--shadow);\r\n      }\r\n\r\n      .brand-area {\r\n        display: flex;\r\n        align-items: center;\r\n        gap: 0.75rem;\r\n      }\r\n\r\n      .pulse-dot {\r\n        width: 10px;\r\n        height: 10px;\r\n        border-radius: 50%;\r\n        background: var(--accent);\r\n        box-shadow: 0 0 12px var(--accent);\r\n        animation: pulse 2s infinite;\r\n      }\r\n\r\n      @keyframes pulse {\r\n        0%,\r\n        100% {\r\n          transform: scale(1);\r\n          opacity: 1;\r\n        }\r\n        50% {\r\n          transform: scale(1.35);\r\n          opacity: 0.6;\r\n        }\r\n      }\r\n\r\n      .brand {\r\n        font-family: "Newsreader", Georgia, serif;\r\n        font-size: 1.45rem;\r\n        font-weight: 600;\r\n        letter-spacing: -0.01em;\r\n      }\r\n\r\n      .theme-switcher {\r\n        display: flex;\r\n        align-items: center;\r\n        gap: 0.4rem;\r\n        background: rgba(128, 128, 128, 0.1);\r\n        padding: 0.3rem;\r\n        border-radius: 999px;\r\n        border: 1px solid var(--line);\r\n      }\r\n\r\n      .theme-label {\r\n        font-size: 0.8rem;\r\n        font-weight: 600;\r\n        text-transform: uppercase;\r\n        letter-spacing: 0.05em;\r\n        color: var(--muted);\r\n        padding: 0 0.6rem;\r\n      }\r\n\r\n      .theme-btn {\r\n        border: none;\r\n        background: transparent;\r\n        color: var(--text);\r\n        padding: 0.4rem 0.9rem;\r\n        border-radius: 999px;\r\n        font-size: 0.85rem;\r\n        font-weight: 500;\r\n        cursor: pointer;\r\n        transition: all 0.25s ease;\r\n      }\r\n\r\n      .theme-btn:hover {\r\n        background: var(--tag-bg);\r\n      }\r\n\r\n      .theme-btn[aria-pressed="true"] {\r\n        background: var(--accent);\r\n        color: var(--accent-text);\r\n        font-weight: 600;\r\n        box-shadow: 0 2px 10px var(--accent-glow);\r\n      }\r\n\r\n      .main-grid {\r\n        display: grid;\r\n        grid-template-columns: 310px 1fr;\r\n        gap: 2rem;\r\n        align-items: start;\r\n      }\r\n\r\n      aside.profile-sidebar {\r\n        position: sticky;\r\n        top: 1.5rem;\r\n        background: var(--surface);\r\n        border: 1px solid var(--line);\r\n        border-radius: 20px;\r\n        padding: 1.75rem 1.4rem;\r\n        backdrop-filter: blur(16px);\r\n        -webkit-backdrop-filter: blur(16px);\r\n        box-shadow: var(--shadow);\r\n        transition:\r\n          background 0.35s ease,\r\n          border-color 0.35s ease;\r\n      }\r\n\r\n      .profile-pic-frame {\r\n        width: 148px;\r\n        height: 148px;\r\n        margin: 0 auto 1.25rem;\r\n        border-radius: 50%;\r\n        padding: 4px;\r\n        background: linear-gradient(135deg, var(--accent), transparent 75%);\r\n        box-shadow: 0 8px 24px var(--accent-glow);\r\n        position: relative;\r\n      }\r\n\r\n      .profile-pic-frame img {\r\n        width: 100%;\r\n        height: 100%;\r\n        object-fit: cover;\r\n        object-position: top center;\r\n        border-radius: 50%;\r\n        display: block;\r\n        border: 3px solid var(--surface);\r\n        background: #1e293b;\r\n      }\r\n\r\n      .student-identity {\r\n        text-align: center;\r\n        margin-bottom: 1.25rem;\r\n      }\r\n\r\n      .student-identity h2 {\r\n        font-family: "Newsreader", Georgia, serif;\r\n        font-size: 1.45rem;\r\n        margin: 0 0 0.2rem;\r\n        line-height: 1.2;\r\n      }\r\n\r\n      .student-identity .subtitle {\r\n        font-size: 0.85rem;\r\n        color: var(--accent);\r\n        font-weight: 600;\r\n        letter-spacing: 0.03em;\r\n      }\r\n\r\n      .credentials-table {\r\n        width: 100%;\r\n        border-collapse: collapse;\r\n        margin-top: 0.75rem;\r\n        font-size: 0.88rem;\r\n        border-radius: 10px;\r\n        overflow: hidden;\r\n        border: 1px solid var(--line);\r\n      }\r\n\r\n      .credentials-table th,\r\n      .credentials-table td {\r\n        padding: 0.75rem 0.8rem;\r\n        text-align: left;\r\n        border-bottom: 1px solid var(--line);\r\n      }\r\n\r\n      .credentials-table tr:last-child th,\r\n      .credentials-table tr:last-child td {\r\n        border-bottom: none;\r\n      }\r\n\r\n      .credentials-table tr:nth-child(even) {\r\n        background: var(--table-stripe);\r\n      }\r\n\r\n      .credentials-table th {\r\n        color: var(--muted);\r\n        font-weight: 600;\r\n        width: 44%;\r\n        font-size: 0.8rem;\r\n        text-transform: uppercase;\r\n        letter-spacing: 0.04em;\r\n      }\r\n\r\n      .credentials-table td {\r\n        font-family: "JetBrains Mono", monospace;\r\n        font-weight: 500;\r\n        color: var(--text);\r\n        font-size: 0.84rem;\r\n      }\r\n\r\n      .sidebar-tags {\r\n        display: flex;\r\n        flex-wrap: wrap;\r\n        gap: 0.4rem;\r\n        margin-top: 1.25rem;\r\n        justify-content: center;\r\n      }\r\n\r\n      .sidebar-tags span {\r\n        font-size: 0.74rem;\r\n        padding: 0.25rem 0.65rem;\r\n        border-radius: 999px;\r\n        background: var(--tag-bg);\r\n        color: var(--accent);\r\n        font-weight: 600;\r\n      }\r\n\r\n      .hero-card {\r\n        background: var(--surface);\r\n        border: 1px solid var(--line);\r\n        border-radius: 20px;\r\n        padding: clamp(1.75rem, 4vw, 2.75rem);\r\n        margin-bottom: 2rem;\r\n        backdrop-filter: blur(16px);\r\n \n      }\r\n\r\n      .content-tags span {\r\n        font-family: "JetBrains Mono", monospace;\r\n        font-size: 0.72rem;\r\n        padding: 0.2rem 0.55rem;\r\n        border-radius: 6px;\r\n        background: var(--tag-bg);\r\n        color: var(--accent);\r\n        border: 1px solid var(--line);\r\n      }\r\n\r\n      .info-btn {\r\n        width: 100%;\r\n        background: transparent;\r\n        border: 1px solid var(--accent);\r\n        color: var(--accent);\r\n        padding: 0.55rem 1rem;\r\n        border-radius: 10px;\r\n        font-weight: 600;\r\n        font-size: 0.88rem;\r\n        cursor: pointer;\r\n        transition: all 0.22s ease;\r\n      }\r\n\r\n      .info-btn:hover,\r\n      .info-btn[aria-expanded="true"] {\r\n        background: var(--accent);\r\n        color: var(--accent-text);\r\n      }\r\n\r\n      .session-details {\r\n        margin-top: 1rem;\r\n        padding-top: 1rem;\r\n        border-top: 1px dashed var(--line);\r\n        font-size: 0.9rem;\r\n        animation: fadeSlide 0.25s ease;\r\n      }\r\n\r\n      .session-details[hidden] {\r\n        display: none;\r\n      }\r\n\r\n      @keyframes fadeSlide {\r\n        from {\r\n          opacity: 0;\r\n          transform: translateY(-6px);\r\n        }\r\n        to {\r\n          opacity: 1;\r\n          transform: translateY(0);\r\n        }\r\n      }\r\n\r\n      .session-details dl {\r\n        margin: 0;\r\n        display: grid;\r\n        grid-template-columns: auto 1fr;\r\n        gap: 0.45rem 0.85rem;\r\n      }\r\n\r\n      .session-details dt {\r\n        color: var(--muted);\r\n        font-weight: 600;\r\n        font-size: 0.82rem;\r\n      }\r\n\r\n      .session-details dd {\r\n        margin: 0;\r\n        color: var(--text);\r\n      }\r\n\r\n      footer {\r\n        margin-top: 3rem;\r\n        padding: 1.25rem 1.5rem;\r\n        background: var(--surface);\r\n        border: 1px solid var(--line);\r\n        border-radius: 14px;\r\n        backdrop-filter: blur(12px);\r\n        display: flex;\r\n        flex-wrap: wrap;\r\n        justify-content: space-between;\r\n        align-items: center;\r\n        gap: 0.75rem;\r\n        font-size: 0.88rem;\r\n        color: var(--muted);\r\n      }\r\n\r\n      @media (max-width: 72rem) {\r\n        .sessions-grid {\r\n          grid-template-columns: repeat(2, 1fr);\r\n        }\r\n      }\r\n\r\n      @media (max-width: 56rem) {\r\n        .main-grid {\r\n          grid-template-columns: 1fr;\r\n        }\r\n        aside.profile-sidebar {\r\n          position: static;\r\n          max-width: 460px;\r\n          margin: 0 auto;\r\n          width: 100%;\r\n        }\r\n        .sessions-grid {\r\n          grid-template-columns: repeat(2, 1fr);\r\n        }\r\n      }\r\n\r\n      @media (max-width: 38rem) {\r\n        .sessions-grid {\r\n          grid-template-columns: 1fr;\r\n        }\r\n        .theme-label {\r\n          display: none;\r\n        }\r\n        header.topbar {\r\n          justify-content: center;\r\n        }\r\n      }\r\n    \u003c/style>\r\n  \u003c/head>\r\n  \u003cbody>\r\n    \u003cdiv class="wallpaper-container" aria-hidden="true">\r\n      \u003cvideo id="live-wallpaper" autoplay loop muted playsinline>\r\n        \u003csource src="fredrick wall.mp4" type="video/mp4" />\r\n      \u003c/video>\r\n      \u003ccanvas id="fallback-canvas">\u003c/canvas>\r\n    \u003c/div>\r\n    \u003cdiv class="wallpaper-tint" aria-hidden="true">\u003c/div>\r\n\r\n    \u003cdiv class="container">\r\n      \u003cheader class="topbar">\r\n        \u003cdiv class="brand-area">\r\n          \u003cspan class="pulse-dot" aria-hidden="true">\u003c/span>\r\n          \u003cdiv class="brand">Fredrick’s blog\u003c/div>\r\n        \u003c/div>\r\n\r\n        \u003cdiv class="theme-switcher" role="group" aria-label="Choose a theme">\r\n          \u003cspan class="theme-label">Theme\u003c/span>\r\n          \u003cbutton\r\n            type="button"\r\n            class="theme-btn"\r\n            data-theme-btn="meadow"\r\n            aria-pressed="false"\r\n          >\r\n            🌿 Meadow\r\n          \u003c/button>\r\n          \u003cbutton\r\n            type="button"\r\n            class="theme-btn"\r\n            data-theme-btn="dark"\r\n            aria-pressed="true"\r\n          >\r\n            🌙 Dark\r\n          \u003c/button>\r\n          \u003cbutton\r\n            type="button"\r\n            class="theme-btn"\r\n            data-theme-btn="light"\r\n            aria-pressed="false"\r\n          >\r\n            ☀️ Light\r\n          \u003c/button>\r\n        \u003c/div>\r\n      \u003c/header>\r\n\r\n      \u003cdiv class="main-grid">\r\n        \u003caside\r\n          class="profile-sidebar"\r\n          aria-label="Student Profile and Credentials"\r\n        >\r\n          \u003cdiv class="profile-pic-frame">\r\n            \u003cimg\r\n              src="fredrick profile.png"\r\n              alt="Fredrick Mugabi"\r\n              onerror="\r\n                this.src =\r\n                  \'data:image/svg+xml;utf8,\u003csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22 viewBox=%220 0 200 200%22>\u003crect width=%22200%22 height=%22200%22 fill=%22%231e293b%22/>\u003ctext x=%2250%25%22 y=%2254%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2256%22 font-weight=%22bold%22 fill=%22%2338bdf8%22>FM\u003c/text>\u003c/svg>\'\r\n              "\r\n            />\r\n          \u003c/div>\r\n\r\n          \u003cdiv class="student-identity">\r\n            \u003ch2>Fredrick Mugabi\u003c/h2>\r\n            \u003cdiv class="subtitle">Makerere University • Web Developer\u003c/div>\r\n          \u003c/div>\r\n\r\n          \u003ctable class="credentials-table">\r\n            \u003ctbody>\r\n              \u003ctr>\r\n                \u003cth scope="row">My Course:\u003c/th>\r\n                \u003ctd>BIST\u003c/td>\r\n              \u003c/tr>\r\n              \u003ctr>\r\n                \u003cth scope="row">My Reg. No.:\u003c/th>\r\n                \u003ctd>25/U/03889/PS\u003c/td>\r\n              \u003c/tr>\r\n              \u003ctr>\r\n                \u003cth scope="row">My Student No.:\u003c/th>\r\n                \u003ctd>2500703889\u003c/td>\r\n              \u003c/tr>\r\n            \u003c/tbody>\r\n          \u003c/table>\r\n\r\n          \u003cdiv class="sidebar-tags">\r\n            \u003cspan>#HTML5\u003c/span>\r\n            \u003cspan>#CSS3\u003c/span>\r\n            \u003cspan>#JavaScript\u003c/span>\r\n            \u003cspan>#BIST\u003c/span>\r\n          \u003c/div>\r\n        \u003c/aside>\r\n\r\n        \u003cdiv>\r\n          \u003csection class="hero-card">\r\n           \r\n            \u003ch1>Notes on learning to build a website\u003c/h1>\r\n            \u003cp>\r\n              Hi, I’m \u003cstrong>Fredrick Mugabi\u003c/strong>, writing down what I\r\n              learn, one session at a time. Explore my journey across semantic\r\n              markup, responsive layouts, and interactive scripting—open any\r\n              session’s info panel to inspect when it happened, key concepts,\r\n              and practical takeaways.\r\n            \u003c/p>\r\n          \u003c/section>\r\n\r\n          \u003cdiv class="filter-bar">\r\n            \u003ch2 class="section-heading">Learning Sessions\u003c/h2>\r\n            \u003cdiv\r\n              class="tag-filters"\r\n              role="group"\r\n              aria-label="Filter sessions by topic"\r\n            >\r\n              \u003cbutton\r\n                type="button"\r\n                class="filter-pill active"\r\n                data-filter="all"\r\n              >\r\n                All (3)\r\n              \u003c/button>\r\n              \u003cbutton type="button" class="filter-pill" data-filter="html">\r\n                HTML5\r\n              \u003c/button>\r\n              \u003cbutton type="button" class="filter-pill" data-filter="css">\r\n                CSS & Grid\r\n              \u003c/button>\r\n              \u003cbutton type="button" class="filter-pill" data-filter="js">\r\n                JavaScript\r\n              \u003c/button>\r\n            \u003c/div>\r\n          \u003c/div>\r\n\r\n          \u003cmain class="sessions-grid">\r\n            \u003carticle class="session-card" data-category="html">\r\n              \u003cdiv class="session-top-meta">\r\n                \u003cspan class="session-number">Session 1\u003c/span>\r\n                \u003cspan class="reading-time">1 hr lab\u003c/span>\r\n              \u003c/div>\r\n              \u003ch3>Getting started with HTML\u003c/h3>\r\n              \u003cp class="summary">\r\n                I built my first page from scratch: headings, paragraphs, links\r\n                and images. Seeing structure come together without any styling\r\n                taught me why meaning matters before looks.\r\n              \u003c/p>\r\n              \u003cdiv class="content-tags">\r\n                \u003cspan>#SemanticHTML\u003c/span>\r\n                \u003cspan>#Accessibility\u003c/span>\r\n                \u003cspan>#DOMStructure\u003c/span>\r\n              \u003c/div>\r\n              \u003cbutton\r\n                class="info-btn"\r\n                type="button"\r\n                aria-expanded="false"\r\n                aria-controls="info1"\r\n              >\r\n                Session info\r\n              \u003c/button>\r\n              \u003cdiv class="session-details" id="info1" hidden>\r\n                \u003cdl>\r\n                  \u003cdt>Date\u003c/dt>\r\n                  \u003cdd>20th October 2026\u003c/dd>\r\n                  \u003cdt>Length\u003c/dt>\r\n                  \u003cdd>1 hour\u003c/dd>\r\n                  \u003cdt>Topics\u003c/dt>\r\n                  \u003cdd>Semantic tags, links, images, document outline\u003c/dd>\r\n                  \u003cdt>Deliverable\u003c/dt>\r\n                  \u003cdd>Accessible multi-section structural skeleton\u003c/dd>\r\n                  \u003cdt>Takeaway\u003c/dt>\r\n                  \u003cdd>Write the structure first, style second.\u003c/dd>\r\n                \u003c/dl>\r\n              \u003c/div>\r\n            \u003c/article>\r\n\r\n            \u003carticle class="session-card" data-category="css">\r\n              \u003cdiv class="session-top-meta">\r\n                \u003cspan class="session-number">Session 2\u003c/span>\r\n                \u003cspan class="reading-time">2 hrs lab\u003c/span>\r\n              \u003c/div>\r\n              \u003ch3>Styling with CSS\u003c/h3>\r\n              \u003cp class="summary">\r\n                The colors, fonts and spacing turned a plain document into\r\n                something with a personality. Flexbox and grid finally made\r\n                layout feel logical instead of like guesswork.\r\n              \u003c/p>\r\n              \u003cdiv class="content-tags">\r\n                \u003cspan>#CSSGrid\u003c/span>\r\n                \u003cspan>#Flexbox\u003c/span>\r\n                \u003cspan>#ResponsiveUI\u003c/span>\r\n              \u003c/div>\r\n              \u003cbutton\r\n                class="info-btn"\r\n                type="button"\r\n                aria-expanded="false"\r\n                aria-controls="info2"\r\n              >\r\n                Session info\r\n              \u003c/button>\r\n              \u003cdiv class="session-details" id="info2" hidden>\r\n                \u003cdl>\r\n                  \u003cdt>Date\u003c/dt>\r\n                  \u003cdd>21st October 2026\u003c/dd>\r\n                  \u003cdt>Length\u003c/dt>\r\n                  \u003cdd>2 hours\u003c/dd>\r\n                  \u003cdt>Topics\u003c/dt>\r\n                  \u003cdd>\r\n                    Box model, flexbox, grid, media queries, CSS variables\r\n                  \u003c/dd>\r\n                  \u003cdt>Deliverable\u003c/dt>\r\n                  \u003cdd>\r\n                    Fluid 3-column layout adapting to mobile &amp; desktop\r\n                  \u003c/dd>\r\n                  \u003cdt>Takeaway\u003c/dt>\r\n                  \u003cdd>Design for the smallest screen first.\u003c/dd>\r\n                \u003c/dl>\r\n              \u003c/div>\r\n            \u003c/article>\r\n\r\n            \u003carticle class="session-card" data-category="js">\r\n              \u003cdiv class="session-top-meta">\r\n                \u003cspan class="session-number">Session 3\u003c/span>\r\n                \u003cspan class="reading-time">2 hrs lab\u003c/span>\r\n              \u003c/div>\r\n              \u003ch3>Adding interactivity with JavaScript\u003c/h3>\r\n              \u003cp class="summary">\r\n                I made the page respond to clicks: switching themes and\r\n                revealing details on demand. Small scripts changed how the whole\r\n                page felt to use.\r\n              \u003c/p>\r\n              \u003cdiv class="content-tags">\r\n                \u003cspan>#JavaScript\u003c/span>\r\n                \u003cspan>#ThemeEngine\u003c/span>\r\n                \u003cspan>#LocalStorage\u003c/span>\r\n              \u003c/div>\r\n              \u003cbutton\r\n                class="info-btn"\r\n                type="button"\r\n                aria-expanded="false"\r\n                aria-controls="info3"\r\n              >\r\n                Session info\r\n              \u003c/button>\r\n              \u003cdiv class="session-details" id="info3" hidden>\r\n                \u003cdl>\r\n                  \u003cdt>Date\u003c/dt>\r\n                  \u003cdd>20th October 2026\u003c/dd>\r\n                  \u003cdt>Length\u003c/dt>\r\n                  \u003cdd>2 hours\u003c/dd>\r\n                  \u003cdt>Topics\u003c/dt>\r\n                  \u003cdd>DOM manipulation, event listeners, saving preferences\u003c/dd>\r\n                  \u003cdt>Deliverable\u003c/dt>\r\n                  \u003cdd>Live theme switcher &amp; interactive session drawers\u003c/dd>\r\n                  \u003cdt>Takeaway\u003c/dt>\r\n                  \u003cdd>Let visitors choose how the page looks.\u003c/dd>\r\n                \u003c/dl>\r\n              \u003c/div>\r\n            \u003c/article>\r\n          \u003c/main>\r\n        \u003c/div>\r\n      \u003c/div>\r\n\r\n    \u003cfooter>\r\n      \u003cdiv>&copy; \u003cstrong>2026 Fredrick Mugabi\u003c/strong> • BIST (25/U/03889/PS)\u003c/div>\r\n      \u003cdiv>I built this with Semantic HTML, Responsive CSS Grid &amp; Vanilla JS\u003c/div>\r\n    \u003c/footer>\r\n  \u003c/div>\r\n    \u003c/div>\r\n\r\n    \u003cscript>\r\n      (function () {\r\n        const root = document.documentElement;\r\n        const themeButtons = document.querySelectorAll("[data-theme-btn]");\r\n\r\n        function applyTheme(theme) {\r\n          const validThemes = ["meadow", "dark", "light"];\r\n          const chosen = validThemes.includes(theme) ? theme : "dark";\r\n          root.setAttribute("data-theme", chosen);\r\n\r\n          themeButtons.forEach((btn) => {\r\n            btn.setAttribute(\r\n              "aria-pressed",\r\n              String(btn.getAttribute("data-theme-btn") === chosen),\r\n            );\r\n          });\r\n        }\r\n\r\n        let savedTheme = null;\r\n        try {\r\n          savedTheme = localStorage.getItem("fredrick-blog-theme");\r\n        } catch (e) {}\r\n\r\n        applyTheme(savedTheme || "dark");\r\n\r\n        themeButtons.forEach((btn) => {\r\n          btn.addEventListener("click", () => {\r\n            const targetTheme = btn.getAttribute("data-theme-btn");\r\n            applyTheme(targetTheme);\r\n            try {\r\n              localStorage.setItem("fredrick-blog-theme", targetTheme);\r\n            } catch (e) {}\r\n          });\r\n        });\r\n\r\n        document.querySelectorAll(".info-btn").forEach((btn) => {\r\n          btn.addEventListener("click", () => {\r\n            const panel = document.getElementById(\r\n              btn.getAttribute("aria-controls"),\r\n            );\r\n            const isOpen = btn.getAttribute("aria-expanded") === "true";\r\n            btn.setAttribute("aria-expanded", String(!isOpen));\r\n            panel.hidden = isOpen;\r\n            btn.textContent = isOpen ? "Session info" : "Hide info";\r\n          });\r\n        });\r\n\r\n        const filterPills = document.querySelectorAll(".filter-pill");\r\n        const sessionCards = document.querySelectorAll(".session-card");\r\n\r\n        filterPills.forEach((pill) => {\r\n          pill.addEventListener("click", () => {\r\n            filterPills.forEach((p) => p.classList.remove("active"));\r\n            pill.classList.add("active");\r\n\r\n            const filter = pill.getAttribute("data-filter");\r\n            sessionCards.forEach((card) => {\r\n              if (\r\n                filter === "all" ||\r\n                card.getAttribute("data-category") === filter\r\n              ) {\r\n                card.style.display = "flex";\r\n              } else {\r\n                card.style.display = "none";\r\n              }\r\n            });\r\n          });\r\n        });\r\n\r\n        const video = document.getElementById("live-wallpaper");\r\n        const canvas = document.getElementById("fallback-canvas");\r\n\r\n        video.addEventListener("ended", () => {\r\n          video.currentTime = 0;\r\n          video.play().catch(() => {});\r\n        });\r\n\r\n        video.querySelector("source").addEventListener("error", () => {\r\n          video.style.display = "none";\r\n          canvas.style.display = "block";\r\n          startMatrixFallback(canvas);\r\n        });\r\n\r\n        function startMatrixFallback(c) {\r\n          const ctx = c.getContext("2d");\r\n          let w = (c.width = window.innerWidth);\r\n          let h = (c.height = window.innerHeight);\r\n          const cols = Math.floor(w / 18);\r\n          const drops = Array(cols).fill(1);\r\n          const chars = "01{}[]\u003c>/;=+const let function";\r\n\r\n          window.addEventListener("resize", () => {\r\n            w = c.width = window.innerWidth;\r\n            h = c.height = window.innerHeight;\r\n          });\r\n\r\n          setInterval(() => {\r\n            ctx.fillStyle = "rgba(6, 11, 16, 0.12)";\r\n            ctx.fillRect(0, 0, w, h);\r\n            ctx.fillStyle = "#14b8a6";\r\n            ctx.font = "14px monospace";\r\n\r\n            for (let i = 0; i \u003c drops.length; i++) {\r\n              const text = chars[Math.floor(Math.random() * chars.length)];\r\n              ctx.fillText(text, i * 18, drops[i] * 18);\r\n              if (drops[i] * 18 > h && Math.random() > 0.975) {\r\n                drops[i] = 0;\r\n              }\r\n              drops[i]++;\r\n            }\r\n          }, 45);\r\n        }\r\n      })();\r\n    \u003c/script>\r\n  \u003c/body>\r\n\u003c/html>\r\n',
        },
      ];

      var holder = document.getElementById("pages");
      var nav = document.getElementById("nav");
      var frames = [];
      var links = [];

      LABELS.forEach(function (label, i) {
        var a = document.createElement("a");
        a.href = "#p" + (i + 1);
        a.textContent = label;
        nav.appendChild(a);
        links.push(a);
      });

      PAGES.forEach(function (p, i) {
        var f = document.createElement("iframe");
        f.id = "p" + (i + 2);
        f.className = "page";
        f.title = p.label;
        f.scrolling = "no";
        f.style.height = "600px";
        holder.appendChild(f);
        frames.push(f);
      });

      function fit(f) {
        try {
          var doc = f.contentDocument;
          if (!doc || !doc.documentElement) return;
          var y = window.scrollY;
          f.style.height = "1px";
          var h = Math.max(
            doc.documentElement.scrollHeight,
            doc.body ? doc.body.scrollHeight : 0,
          );
          f.style.height = h + "px";
          window.scrollTo(0, y);
        } catch (e) {}
      }
      function fitSoon(f) {
        setTimeout(function () {
          fit(f);
        }, 60);
        setTimeout(function () {
          fit(f);
        }, 450);
      }
      function fitAll() {
        frames.forEach(fit);
      }

      frames.forEach(function (f, i) {
        f.addEventListener("load", function () {
          fit(f);
          try {
            var d = f.contentDocument;
            d.addEventListener("click", function () {
              fitSoon(f);
            });
            f.contentWindow.addEventListener("load", function () {
              fitSoon(f);
            });
            Array.prototype.forEach.call(d.images, function (im) {
              im.addEventListener("load", function () {
                fit(f);
              });
            });
            Array.prototype.forEach.call(
              d.querySelectorAll("video"),
              function (v) {
                v.addEventListener("loadedmetadata", function () {
                  fit(f);
                });
              },
            );
          } catch (e) {}
          fitSoon(f);
        });
        f.srcdoc = PAGES[i].html;
      });

      window.addEventListener("resize", fitAll);

      setInterval(function () {
        frames.forEach(function (f) {
          try {
            var d = f.contentDocument;
            var h = Math.max(
              d.documentElement.scrollHeight,
              d.body ? d.body.scrollHeight : 0,
            );
            if (h > parseInt(f.style.height, 10) + 1) fit(f);
          } catch (e) {}
        });
      }, 500);

      var sections = [document.getElementById("p1")].concat(frames);
      function mark() {
        var line = window.innerHeight * 0.35,
          cur = 0;
        sections.forEach(function (s, i) {
          if (s.getBoundingClientRect().top <= line) cur = i;
        });
        links.forEach(function (a, i) {
          a.classList.toggle("active", i === cur);
        });
      }
      window.addEventListener("scroll", mark, { passive: true });
      window.addEventListener("resize", mark);
      mark();
    </script>
  </body>
